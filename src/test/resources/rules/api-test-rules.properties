# =====================================================================
#  API TEST RULEBOOK - applies to EVERY project (RNSB, SPCBL, TNSC, CKYC, new ones)
# ---------------------------------------------------------------------
#  For each negative check:
#    expect.<CHECK>  = HTTP codes a correct banking API returns (first = ideal, others also correct)
#    why.<CHECK>     = what the API must recognise
#    owasp.<CHECK>   = VAPT reference (OWASP API Security Top 10 - 2023 / CWE)
#
#  Judgement (same for every project) - code: negative/VaptRules.java. VAPT FAIL only with PROOF of impact:
#    expected code                      -> PASS  (correct)
#    rejected (4xx) with another code   -> PASS + "wrong status code" note (set negative.strict.status=true to make it FAIL)
#    internal detail in ANY response    -> FAIL Medium (exception / SQL / class name / stack frame; field + text as evidence)
#    injection proof                    -> FAIL High   (DB error on the probe, boolean differential, time delay >= 5 s)
#    XSS proof                          -> FAIL High   (payload unencoded in a text/html response; a JSON echo is not XSS)
#    auth bypass                        -> FAIL Critical (data without / with a tampered token), High on state-changing APIs
#    CSRF / encryption / size limits    -> FAIL High (CSRF on state-changing APIs) / Low (integrity, plain body, size)
#    search / list API, empty or same   -> PASS  (safe handling; optional filters are not mandatory)
#    get-by-id: missing / empty id      -> FAIL Low (CWE-20) ; positive returned no data -> INCONCLUSIVE
#    dates, flags on report filters,
#    5xx without a leak                 -> FUNCTIONAL - QA (not VAPT; vapt.server.error.as.vapt=true counts 5xx as VAPT Low)
#    CSRF on read-only APIs, tampered encryption without an encrypted body, userId on system-wide settings -> NOT APPLICABLE
#
#  A bank with a different standard can override any rule in config.properties, e.g.
#    SPCBL.negative.expect.NO_SESSION=401,403
# =====================================================================

# ---- Valid (positive) requests ----
expect.POSITIVE=200,201,202
why.POSITIVE=a valid request with valid data must succeed
owasp.POSITIVE=-

# ---- Authentication / authorisation ----
expect.NO_SESSION=401
why.NO_SESSION=the caller is not logged in (no session, token or CSRF)
owasp.NO_SESSION=API2:2023 Broken Authentication

expect.WRONG_PASSWORD=401
why.WRONG_PASSWORD=the credentials are wrong
owasp.WRONG_PASSWORD=API2:2023 Broken Authentication

expect.TAMPERED_TOKEN=401
why.TAMPERED_TOKEN=a modified / forged bearer token must never be accepted
owasp.TAMPERED_TOKEN=API2:2023 Broken Authentication - CWE-347 Improper Verification of Cryptographic Signature

expect.TAMPERED_CSRF=403,401
why.TAMPERED_CSRF=a request with a wrong anti-CSRF token must be refused
owasp.TAMPERED_CSRF=OWASP A01 Broken Access Control - CWE-352 Cross-Site Request Forgery

expect.OTHER_USER=403,401
why.OTHER_USER=a logged-in user must not act for, or read, another user's data
owasp.OTHER_USER=API1:2023 Broken Object Level Authorization (BOLA / IDOR)

expect.TAMPERED_ENCRYPTION=400,401
why.TAMPERED_ENCRYPTION=a tampered / undecryptable request must not be trusted
owasp.TAMPERED_ENCRYPTION=API8:2023 Security Misconfiguration - CWE-345 Insufficient Verification of Data Authenticity

expect.PLAIN_BODY=400,415
why.PLAIN_BODY=an encrypted API must refuse a plain (unencrypted) body
owasp.PLAIN_BODY=API8:2023 Security Misconfiguration - CWE-319 Cleartext Transmission of Sensitive Information

# ---- Transport / resource ----
expect.WRONG_METHOD=405
why.WRONG_METHOD=the endpoint must allow only its own HTTP method
owasp.WRONG_METHOD=API8:2023 Security Misconfiguration

expect.LARGE_PAYLOAD=413,400
why.LARGE_PAYLOAD=a body far larger than any valid request must be refused
owasp.LARGE_PAYLOAD=API4:2023 Unrestricted Resource Consumption

# ---- Record lookup ----
expect.NOT_EXISTING=404,400,422
why.NOT_EXISTING=the record does not exist
owasp.NOT_EXISTING=API3:2023 Broken Object Property Level Authorization - CWE-20 Improper Input Validation

# ---- Input validation (all return 400 Bad Request, or 422) ----
expect.WRONG_TYPE=400,422
why.WRONG_TYPE=a field has the wrong data type
owasp.WRONG_TYPE=CWE-20 Improper Input Validation

expect.MISSING_FIELD=400,422
why.MISSING_FIELD=a mandatory field is missing
owasp.MISSING_FIELD=CWE-20 Improper Input Validation

expect.EMPTY_VALUE=400,422
why.EMPTY_VALUE=a mandatory field is empty
owasp.EMPTY_VALUE=CWE-20 Improper Input Validation

expect.SPACES_ONLY=400,422
why.SPACES_ONLY=spaces are not a value
owasp.SPACES_ONLY=CWE-20 Improper Input Validation

expect.INVALID_CODE=400,422
why.INVALID_CODE=a code / flag outside its allowed list
owasp.INVALID_CODE=CWE-20 Improper Input Validation

expect.BOUNDARY=400,422
why.BOUNDARY=the value is longer than the field allows
owasp.BOUNDARY=CWE-20 Improper Input Validation - CWE-1284

expect.INJECTION=400,422
why.INJECTION=SQL injection characters must be rejected or safely handled
owasp.INJECTION=API8:2023 Security Misconfiguration - OWASP A03 Injection (CWE-89)

expect.SPECIAL_CHARS=400,422
why.SPECIAL_CHARS=special characters not allowed in this field
owasp.SPECIAL_CHARS=CWE-20 Improper Input Validation

expect.XSS_SCRIPT=400,422
why.XSS_SCRIPT=script / HTML must be rejected and never echoed back
owasp.XSS_SCRIPT=OWASP A03 Injection - CWE-79 Cross-site Scripting

expect.UNICODE=400,422
why.UNICODE=characters outside the allowed set
owasp.UNICODE=CWE-20 Improper Input Validation

# ---- Dates ----
expect.DATE_INVALID=400,422
why.DATE_INVALID=not a real calendar date
owasp.DATE_INVALID=CWE-20 Improper Input Validation

expect.DATE_FORMAT=400,422
why.DATE_FORMAT=the date is not in the agreed format
owasp.DATE_FORMAT=CWE-20 Improper Input Validation

expect.DATE_RANGE=400,422
why.DATE_RANGE=from-date is after to-date
owasp.DATE_RANGE=CWE-20 Improper Input Validation

expect.DATE_FUTURE=400,422
why.DATE_FUTURE=a future date is not allowed here
owasp.DATE_FUTURE=CWE-20 Improper Input Validation

expect.DOB_TODAY=400,422
why.DOB_TODAY=date of birth cannot be today (KYC rule)
owasp.DOB_TODAY=CWE-20 Improper Input Validation - KYC data quality

expect.DOB_FUTURE=400,422
why.DOB_FUTURE=date of birth cannot be in the future (KYC rule)
owasp.DOB_FUTURE=CWE-20 Improper Input Validation - KYC data quality

expect.DOB_INVALID=400,422
why.DOB_INVALID=date of birth is not a real date
owasp.DOB_INVALID=CWE-20 Improper Input Validation - KYC data quality

expect.DOB_TOO_OLD=400,422
why.DOB_TOO_OLD=unrealistic date of birth
owasp.DOB_TOO_OLD=CWE-20 Improper Input Validation - KYC data quality

# ---- XML / SOAP APIs ----
expect.MALFORMED_XML=400,422
why.MALFORMED_XML=the body is not well-formed XML
owasp.MALFORMED_XML=CWE-20 Improper Input Validation

expect.XXE=400,422
why.XXE=external entities must never be resolved (they can read server files)
owasp.XXE=OWASP A05 Security Misconfiguration - CWE-611 XML External Entity (XXE)

# ---- After the negatives ----
expect.STATE_CHECK=200
why.STATE_CHECK=invalid requests must not change the session, permissions or data
owasp.STATE_CHECK=API6:2023 Unrestricted Access to Sensitive Business Flows

# ---- Findings raised by the evaluation itself ----
owasp.SERVER_ERROR=API8:2023 Security Misconfiguration - CWE-209 / unhandled exception
owasp.INTERNAL_LEAK=API8:2023 Security Misconfiguration - CWE-209 Information Exposure Through an Error Message
