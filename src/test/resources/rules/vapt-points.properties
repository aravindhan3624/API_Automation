# VAPT report text. One VAPT point per check. The order and numbers (VAPT-001 ...) are fixed by VaptCatalog.ORDER,
# so VAPT-004 means the same thing in every project and every run.
#   title  - name of the point
#   what   - what the test does
#   impact - how it affects the bank / customer
#   fix    - what the developer must do
# The expected HTTP code, OWASP / CWE reference and the one-line reason come from api-test-rules.properties.

title.NO_SESSION=Access without login (missing authentication)
what.NO_SESSION=The API is called with no session cookie, token or CSRF token.
impact.NO_SESSION=Anyone on the network can read or change customer KYC data without logging in. Direct data breach and regulatory (RBI / CKYC) exposure.
fix.NO_SESSION=Enforce authentication on every endpoint on the server and return 401 when the session or token is missing.

title.TAMPERED_TOKEN=Forged or modified bearer token accepted
what.TAMPERED_TOKEN=The bearer token is changed (one character flipped) and the API is called.
impact.TAMPERED_TOKEN=An attacker can forge a token and impersonate any user, including administrators.
fix.TAMPERED_TOKEN=Verify the token signature, expiry and issuer on every request and return 401 for any invalid token.

title.TAMPERED_CSRF=Wrong CSRF token accepted (cross-site request forgery)
what.TAMPERED_CSRF=A state-changing request is sent with a wrong X-CSRF-Token.
impact.TAMPERED_CSRF=A malicious web page can make a logged-in user's browser change data without the user knowing.
fix.TAMPERED_CSRF=Validate the anti-CSRF token on every POST / PUT / PATCH / DELETE and return 403 when it does not match.

title.OTHER_USER=Access to another user's data (broken object level authorization / IDOR)
what.OTHER_USER=Two low-privileged users of different FI / branch: user B sends user A's requests with user A's record ids (idor.enabled). A userId swap inside one admin login is not counted.
impact.OTHER_USER=One user can read or change another user's customer records. Breach of customer confidentiality.
fix.OTHER_USER=Check on the server that the record belongs to the logged-in user or role and return 403 otherwise. Never trust ids sent by the client.

title.WRONG_PASSWORD=Login accepts wrong credentials
what.WRONG_PASSWORD=Login is attempted with a wrong password.
impact.WRONG_PASSWORD=Account takeover. Weak lock-out lets attackers guess passwords.
fix.WRONG_PASSWORD=Return 401 with a generic message, lock the account after repeated failures and log the attempts.

title.TAMPERED_ENCRYPTION=Tampered encrypted request accepted
what.TAMPERED_ENCRYPTION=The encrypted payload or key header is altered before sending.
impact.TAMPERED_ENCRYPTION=Request integrity is not guaranteed; an attacker can alter data in transit.
fix.TAMPERED_ENCRYPTION=Reject any payload that fails decryption or the authentication tag with 400 and never process partial data.

title.INJECTION=SQL injection characters not rejected
what.INJECTION=SQL meta-characters (quote, OR 1=1, comment) are sent in each input field.
impact.INJECTION=A successful injection lets an attacker read, change or delete database records (the full KYC database).
fix.INJECTION=Use parameterised queries / ORM bindings only and validate input against an allow-list. Return 400 for invalid input.

title.XSS_SCRIPT=Script / HTML accepted or echoed back (cross-site scripting)
what.XSS_SCRIPT=A script tag is sent in text fields.
impact.XSS_SCRIPT=Stored or reflected script runs in another user's browser: session theft and data tampering.
fix.XSS_SCRIPT=Reject or encode HTML in input, encode on output and never echo raw input in error messages.

title.XXE=XML external entity processing enabled
what.XXE=An XML body with an external entity (file read) is sent.
impact.XXE=The server can be made to read its own files or call internal systems (SSRF), exposing secrets.
fix.XXE=Disable DTDs and external entities in the XML parser.

title.MALFORMED_XML=Malformed XML not rejected
what.MALFORMED_XML=A broken XML body is sent.
impact.MALFORMED_XML=Unstable parsing can crash the service or cause unpredictable behaviour.
fix.MALFORMED_XML=Validate the XML and return 400 with a clear message.

title.WRONG_METHOD=Unsupported HTTP methods accepted
what.WRONG_METHOD=The endpoint is called with HTTP methods it should not support (GET / POST / PUT / PATCH / DELETE).
impact.WRONG_METHOD=Unintended operations (for example DELETE on a read API) can expose or destroy data.
fix.WRONG_METHOD=Allow only the documented method on each route and return 405 with an Allow header for the others.

title.LARGE_PAYLOAD=Very large request body accepted
what.LARGE_PAYLOAD=A body of about 1 MB is sent to an endpoint that expects a few bytes.
impact.LARGE_PAYLOAD=Denial of service: memory and CPU exhaustion from oversized requests.
fix.LARGE_PAYLOAD=Set a maximum request size at the gateway and in the application and return 413.

title.NOT_EXISTING=Non-existing record not handled
what.NOT_EXISTING=An id that does not exist is sent.
impact.NOT_EXISTING=Errors, or data of another record, may be returned; id enumeration becomes possible.
fix.NOT_EXISTING=Return 404 (or a clear business error) and never the data of another record.

title.WRONG_TYPE=Wrong data type accepted
what.WRONG_TYPE=A text value is sent where a number is expected (and the reverse).
impact.WRONG_TYPE=Unexpected conversions can cause crashes or bypass business rules.
fix.WRONG_TYPE=Validate types on the server and return 400.

title.MISSING_FIELD=Mandatory field missing but accepted
what.MISSING_FIELD=Each mandatory field is removed, one at a time.
impact.MISSING_FIELD=Incomplete KYC records get stored and downstream processing fails.
fix.MISSING_FIELD=Validate mandatory fields and return 400 naming the field.

title.EMPTY_VALUE=Empty mandatory value accepted
what.EMPTY_VALUE=Each mandatory field is sent empty.
impact.EMPTY_VALUE=Blank values bypass validation and corrupt data.
fix.EMPTY_VALUE=Reject empty mandatory values with 400.

title.SPACES_ONLY=Only-spaces value accepted
what.SPACES_ONLY=Each field is sent as spaces only.
impact.SPACES_ONLY=Blank-looking values pass validation and corrupt data.
fix.SPACES_ONLY=Trim the input, treat blank as empty and return 400.

title.SPECIAL_CHARS=Special characters accepted where not allowed
what.SPECIAL_CHARS=Special characters are sent in fields that should hold plain text or numbers.
impact.SPECIAL_CHARS=Bad data in KYC records and a stepping stone for injection attacks.
fix.SPECIAL_CHARS=Validate each field against an allow-list pattern and return 400.

title.UNICODE=Unexpected unicode characters accepted
what.UNICODE=Characters outside the allowed set are sent.
impact.UNICODE=Look-alike characters can create duplicate or spoofed records.
fix.UNICODE=Restrict fields to the allowed character set.

title.BOUNDARY=Over-long values accepted
what.BOUNDARY=A value of 300 characters is sent to each text field.
impact.BOUNDARY=Database errors or truncated data; possible storage abuse.
fix.BOUNDARY=Enforce a maximum length per field and return 400.

title.INVALID_CODE=Invalid code / flag accepted
what.INVALID_CODE=A code or flag outside its allowed list is sent.
impact.INVALID_CODE=Business flows can be driven into states they should never reach.
fix.INVALID_CODE=Validate codes against the allowed list and return 400.

title.DATE_INVALID=Impossible calendar date accepted
what.DATE_INVALID=A date such as 31 February is sent.
impact.DATE_INVALID=Wrong dates are stored in KYC and regulatory records.
fix.DATE_INVALID=Parse dates strictly and return 400.

title.DATE_FORMAT=Wrong date format accepted
what.DATE_FORMAT=A date in a different format is sent.
impact.DATE_FORMAT=Dates are misread (day and month swapped) and stored wrongly.
fix.DATE_FORMAT=Accept only the agreed format and return 400.

title.DATE_RANGE=From-date after to-date accepted
what.DATE_RANGE=A date range where the from-date is later than the to-date is sent.
impact.DATE_RANGE=Wrong or empty reports and wrong business decisions.
fix.DATE_RANGE=Validate the range and return 400.

title.DATE_FUTURE=Future date accepted
what.DATE_FUTURE=A future date is sent where it is not allowed.
impact.DATE_FUTURE=Wrong records and a wrong audit trail.
fix.DATE_FUTURE=Reject future dates where they are not allowed with 400.

title.DOB_TODAY=Date of birth equal to today accepted
what.DOB_TODAY=A customer date of birth equal to today is sent.
impact.DOB_TODAY=Fake or test customers enter the CKYC records (KYC data quality failure).
fix.DOB_TODAY=Apply the age rules on the server and return 400.

title.DOB_FUTURE=Future date of birth accepted
what.DOB_FUTURE=A date of birth in the future is sent.
impact.DOB_FUTURE=Invalid customers enter the KYC records.
fix.DOB_FUTURE=Reject with 400.

title.DOB_INVALID=Impossible date of birth accepted
what.DOB_INVALID=A date of birth that does not exist is sent.
impact.DOB_INVALID=Invalid customers enter the KYC records.
fix.DOB_INVALID=Reject with 400.

title.DOB_TOO_OLD=Unrealistic date of birth accepted
what.DOB_TOO_OLD=A date of birth such as the year 1800 is sent.
impact.DOB_TOO_OLD=Invalid customers enter the KYC records.
fix.DOB_TOO_OLD=Apply a sensible age range and return 400.

title.STATE_CHECK=Invalid requests change the session or data
what.STATE_CHECK=The valid request is sent right before the invalid requests of an API (snapshot) and again after them; the data is compared and the accepted invalid requests are named.
impact.STATE_CHECK=A single bad request can log users out, change permissions or alter data.
fix.STATE_CHECK=Make failed requests free of side effects and keep the session valid.

title.SERVER_ERROR=Server error (HTTP 5xx) on invalid input
what.SERVER_ERROR=Every request is checked for HTTP 500 and above.
impact.SERVER_ERROR=Unhandled errors can crash the service, and an attacker can use them for denial of service.
fix.SERVER_ERROR=Handle exceptions and return a controlled 4xx with a safe message.

title.INTERNAL_LEAK=Internal details leaked in error messages
what.INTERNAL_LEAK=Every response (also 4xx and data rows) is scanned for exception class names, SQL errors (SQLException, bad SQL grammar, ORA-), JDBC, Java package names, stack frames and SQL text; the field and the matched text are shown.
impact.INTERNAL_LEAK=Reveals database and code structure, which makes later attacks easier.
fix.INTERNAL_LEAK=Return a generic error message to the client and log the details on the server only.

title.PLAIN_BODY=Unencrypted request accepted on an encrypted API
what.PLAIN_BODY=The valid request is sent as plain JSON, without the encryption envelope (no clientsecret / clientpublickey).
impact.PLAIN_BODY=The end-to-end encryption of request bodies can be bypassed; data can be sent and changed in clear text.
fix.PLAIN_BODY=Accept only encrypted bodies on encrypted endpoints and return 400 for a plain body.
